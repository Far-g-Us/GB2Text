[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gb2text"
version = "1.3.0"
description = "GB/GBC/GBA ROM text extraction and reinsertion framework"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "pillow>=10.0",
    "pygments>=2.15",
    "tkinterdnd2>=0.4.3",
    "scikit-learn>=1.0",
    "googletrans>=4.0",
    "deepl>=1.18",
    "pyspellchecker>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyinstaller>=5.0",
]

[project.scripts]
gb2text = "api.cli:main"

# Vнешние плагины регистрируются в группе gb2text.plugins (см. core/plugin_manager.py).
# Пустая группа резервирует namespace в metadata.
[project.entry-points."gb2text.plugins"]

[tool.setuptools.packages.find]
include = ["core*", "plugins*", "gui*", "api*"]

[tool.setuptools.package-data]
gb2text = []