# MyPy type checker configuration

[mypy]
python_version = 3.11
exclude = (dist/|build/|htmlcov/|script_game/|scripts_roms/|test_run\.py)
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
follow_imports = skip
ignore_missing_imports = True

[mypy-core.*]
ignore_errors = False

[mypy-gui.*]
ignore_errors = False

[mypy-tests.*]
disallow_untyped_defs = False

[mypy-setup]
ignore_errors = True

[mypy-build.*]
ignore_errors = True

[mypy-dist.*]
ignore_errors = True

# script_game/, scripts/, scripts_roms/ are one-off RE scripts and helper
# tools: not shipped, not covered by the test suite. Their ratio of type
# errors (158) to value is poor, so the strict gate stays on
# core/ plugins/ gui/ api/ where it actually protects the pipeline.



